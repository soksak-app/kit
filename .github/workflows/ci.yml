name: ci
# build-machine: skip build reason=the kit is JavaScript that runs as it is written
# build-machine: skip smoke reason=the kit is a set of checks; its tests run them

# release.yml calls this workflow on each push to main, so a push runs the checks once.
on:
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit message check reads every commit of the pushed range.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Test
        run: make test
      - name: Check
        run: make check
      - name: Commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: node commits-check.js ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Checklist history
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: node records-check.js --range ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
